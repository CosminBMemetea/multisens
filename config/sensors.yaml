# Sensor ingestion config. Each entry becomes one rtsp_ingestion_node
# instance. Adding a sensor here is the whole change needed to bring it
# online - no code changes, no rebuild.
#
# id:           unique identifier, used as the ROS node name (<id>_ingestion)
# modality:     used to derive the topic: /multisens/sensors/<modality>/image_raw
# source_type:  physical | simulated - never implied, always explicit
# transport:    only "rtsp" is implemented; other values are skipped with a
#               warning rather than crashing the whole launch
# url:          host.docker.internal resolves to the Mac host from inside the
#               ros container (Docker Desktop for Mac only - not portable to
#               plain Linux Docker without changing this)
# expected_fps: optional, nominal capture rate for this sensor, purely for
#               diagnostics comparison against the measured rate - omit it
#               if genuinely unknown rather than guessing; diagnostics report
#               "unavailable" for expected_fps when it's absent, not a made-up
#               number
# derived_from_sensor_id: optional, v1.0-RC issue #124 - truthfully declares
#               this feed is a transform of another declared sensor's signal
#               (e.g. depth/thermal below are ffmpeg pseudocolor transforms of
#               rgb's own webcam capture, not independent measurements).
#               source_type: simulated alone can't express *which* real sensor
#               a simulated feed is standing in for - this can. Must name a
#               sensor id declared in this same file (validated at launch).

sensors:
  - id: rgb
    modality: rgb
    source_type: physical
    transport: rtsp
    url: rtsp://host.docker.internal:8554/rgb
    expected_fps: 30
    # v0.9, Phase 102: wires this sensor's existing ingestion up to the
    # built-in RTSP SensorConnector plugin too, purely for /api/connectors
    # visibility (docs/connector-api.md) - the actual video stream is
    # still started independently by ROS launch off `url` above,
    # completely unchanged; `connector.config.uri` intentionally repeats
    # the same URL rather than deriving it, since the connector plugin
    # and the ROS ingestion node are two independent consumers of this
    # file, not one reading the other's config.
    connector:
      plugin: multisens.builtin.sensor.rtsp
      config:
        uri: rtsp://host.docker.internal:8554/rgb

  - id: depth
    modality: depth
    source_type: simulated
    transport: rtsp
    url: rtsp://host.docker.internal:8554/depth
    expected_fps: 30
    derived_from_sensor_id: rgb

  - id: thermal
    modality: thermal
    source_type: simulated
    transport: rtsp
    url: rtsp://host.docker.internal:8554/thermal
    expected_fps: 30
    derived_from_sensor_id: rgb

# platform_id: this machine's declared identity for live resource
# observations (v0.9.1, issue #111) - ExecutionPlatform's own docstring
# (backend/app/domain/resources.py) is explicit that this is "declared,
# never auto-detected by magic." Falls back to 'unknown' if omitted.
platform_id: reference-dev-macbook

# resource_collectors: activates live, session-bound resource collection
# (v0.9.1, issue #111 - see docs/resources.md#live-collection). Each
# entry mirrors poll_connectors' own id/plugin/config/poll_interval_s
# shape. The built-in system-metrics collector needs no separate
# `pip install` - it's always discovered alongside the RTSP connector
# (app/plugins/builtin_resource_collector.py) - naming it here is what
# turns "discovered" into "actually sampling while a session runs."
resource_collectors:
  - id: system-metrics
    plugin: multisens.builtin.resource.system-metrics
    poll_interval_s: 5.0
