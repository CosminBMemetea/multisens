# Sensor ingestion config. Each entry becomes one rtsp_ingestion_node
# instance. Adding a sensor here is the whole change needed to bring it
# online - no code changes, no rebuild.
#
# id:           unique identifier, used as the ROS node name (<id>_ingestion)
# modality:     used to derive the topic: /multisens/sensors/<modality>/image_raw
# source_type:  physical | simulated - never implied, always explicit
# transport:    only "rtsp" is implemented; other values are skipped with a
#               warning rather than crashing the whole launch
# url:          host.docker.internal resolves to the Mac host from inside the
#               ros container (Docker Desktop for Mac only - not portable to
#               plain Linux Docker without changing this)
# expected_fps: optional, nominal capture rate for this sensor, purely for
#               diagnostics comparison against the measured rate
# derived_from_sensor_id: optional, v1.0-RC issue #124 - truthfully declares
#               this feed is a transform of another declared sensor's signal
#               (depth/thermal below are ffmpeg pseudocolor transforms of
#               rgb's own webcam capture, not independent measurements).
# display_name, role, recorded: optional, additive passthrough fields (see
#               frontend/src/types.ts). recorded is deliberately omitted
#               below - this is genuine live capture, not a replay.
#
# This is the Emotion Demo config: a live webcam feeds one physical RGB
# sensor plus two derived simulated feeds (depth/thermal pseudocolor
# transforms of the same capture - scripts/stream_macos.sh in the
# sibling multirtsp repo does the 3-way split). Inference (face
# detection + FER+ emotion classification) now runs on RGB *and* depth
# (issue #139) - deliberately, as an honest cross-source comparison, not
# a claim that the RGB-trained model "works" on a pseudocolor transform.
# The whole point is to let Evidence Playback show what actually happens
# (AGREE/DISAGREE per source) rather than asserting it in a doc comment.
# Thermal stays inference-free for now - three live workers is already a
# real CPU/swap cost on this machine; a fourth is a follow-up, not free.
#
# emotion_demo_face_rgb also now runs a SECOND, independent producer
# (issue #142's own v1.x multi-model architecture work): MediaPipe face
# detection, alongside the FER+ emotion connector already there - two
# completely separate worker processes, two completely separate
# PollRunner threads, neither aware the other exists, both polling the
# exact same sensor. This is the concrete proof that "N inference
# producers per sensor" needed no core code change - only this file.
#
# The RideSafe demo config (ridesafe_front_rgb/ridesafe_rear_rgb) this
# replaced is preserved in git history - `git log --oneline -- config/
# sensors.yaml` to find the commit, then `git show <commit>:config/
# sensors.yaml` - not duplicated here per "smallest correct configuration."

sensors:
  - id: emotion_demo_face_rgb
    modality: rgb
    source_type: physical
    transport: rtsp
    url: rtsp://host.docker.internal:8554/rgb
    expected_fps: 30
    display_name: Emotion Demo (Face)
    role: face

  - id: emotion_demo_face_depth
    modality: depth
    source_type: simulated
    transport: rtsp
    url: rtsp://host.docker.internal:8554/depth
    expected_fps: 30
    derived_from_sensor_id: emotion_demo_face_rgb
    display_name: Emotion Demo (Depth, simulated)

  - id: emotion_demo_face_thermal
    modality: thermal
    source_type: simulated
    transport: rtsp
    url: rtsp://host.docker.internal:8554/thermal
    expected_fps: 30
    derived_from_sensor_id: emotion_demo_face_rgb
    display_name: Emotion Demo (Thermal, simulated)

# platform_id: this machine's declared identity for live resource
# observations (v0.9.1, issue #111) - never auto-detected by magic.
platform_id: reference-dev-macbook

# resource_collectors: activates live, session-bound resource collection
# (v0.9.1, issue #111).
resource_collectors:
  - id: system-metrics
    plugin: multisens.builtin.resource.system-metrics
    poll_interval_s: 5.0

# inference_connectors: session-bound background inference (v1.0-RC issue
# #122). RGB and depth (issue #139) - see the module-level note above.
# Each entry is its own emotion_worker process on its own port; the
# bridge plugin itself is unchanged and unaware there's more than one
# instance - "add a sensor's worth of inference" is a config-only change,
# same "no code change, no rebuild" property sensors: above already has.
#
# task: facial_emotion, not a derived present/absent-style label - this
# bridge's poll() genuinely emits value: {detections: [...]} (raw
# class/confidence/bbox, 0-or-1 entries), matching the RideSafe demo's
# own "task name must match the value shape it actually carries" rule.
# Both connectors share the same task name deliberately, so Evidence
# Playback treats RGB and depth as two comparable sources for one task
# rather than two unrelated tasks.
#
# worker_url: host.docker.internal because the reference emotion_worker
# processes run on the host (outside docker compose - see
# examples/plugins/reference-inference-emotion/worker/README.md).
inference_connectors:
  - id: emotion_demo_face_detector
    plugin: multisens.reference.inference.emotion_bridge
    config:
      sensor_id: emotion_demo_face_rgb
      modality: rgb
      task: facial_emotion
      worker_url: http://host.docker.internal:9200
      stale_after_s: 8.0
    poll_interval_s: 1.0

  - id: emotion_demo_depth_detector
    plugin: multisens.reference.inference.emotion_bridge
    config:
      sensor_id: emotion_demo_face_depth
      modality: depth
      task: facial_emotion
      worker_url: http://host.docker.internal:9201
      stale_after_s: 8.0
      # The bridge refuses a non-RGB modality by default (an RGB-trained
      # model against a simulated feed is exactly the "meaningful without
      # evidence" claim this project won't make silently) - this override
      # is the deliberate, disclosed exception: we WANT to measure how it
      # actually performs on the pseudocolor depth feed, not assume.
      allow_simulated_input: true
    poll_interval_s: 1.0

  - id: emotion_demo_face_detector_mediapipe
    plugin: multisens.reference.inference.mediapipe_bridge
    config:
      sensor_id: emotion_demo_face_rgb
      modality: rgb
      task: face_detection
      worker_url: http://host.docker.internal:9400
      stale_after_s: 8.0
    poll_interval_s: 1.0
