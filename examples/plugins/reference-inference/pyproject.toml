[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multisens-reference-inference"
version = "0.1.0"
description = "Reference MultiSens plugin - a thin PredictionConnector bridge that polls a separately-running YOLOv8n inference worker over HTTP (see worker/) and translates its output into canonical Prediction objects. Zero ML dependency itself - demonstrates process-isolated background inference (v1.0-RC, issue #123)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "MultiSens Project" }]
requires-python = ">=3.10"
dependencies = ["multisens-sdk"]

[project.optional-dependencies]
testing = ["multisens-sdk[testing]", "pytest>=8.0"]

[project.entry-points."multisens.plugins"]
"multisens.reference.inference.yolo_bridge" = "multisens_reference_inference.bridge:create"

[tool.setuptools.packages.find]
include = ["multisens_reference_inference*"]
