[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multisens-reference-inference-emotion-worker"
version = "0.1.0"
description = "Reference emotion-classification inference worker - standalone process, own RTSP reader, runs OpenCV face detection + the emotion-ferplus ONNX model, serves detections over a small local HTTP endpoint. NOT a MultiSens plugin (no entry_points, never installed into the backend image) - install its own requirements.txt separately to actually run it; `pip install -e .` alone (no extras) installs only the pure-logic modules (detections.py/state.py/server.py) with zero heavy dependencies, which is all `tests/` needs."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "MultiSens Project" }]
requires-python = ">=3.10"
# multisens-worker-kit (issue #141): the small, dependency-free HTTP/
# state/logging toolkit this package's own state.py/server.py/log.py now
# re-export - install the sibling worker-kit/ directory first (see this
# package's own README), same two-step local-package pattern the
# reference bridges already use for multisens-sdk.
dependencies = ["multisens-worker-kit"]

[project.optional-dependencies]
testing = ["multisens-worker-kit[testing]", "pytest>=8.0"]
# The actual runtime deps (opencv/onnxruntime/numpy) live in
# requirements.txt, not here - same reasoning as the sibling yolo_worker
# package: `pip install -e .[testing]` for the pure-logic test suite
# never drags them in.

[tool.setuptools.packages.find]
include = ["emotion_worker*"]

[tool.setuptools.package-data]
emotion_worker = ["model/*.onnx"]
