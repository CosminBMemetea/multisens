server {
    # Both families: nginx (stock and this config, historically) only
    # listened on IPv4, which happened to work only as long as the
    # container's "localhost" resolver picked 127.0.0.1 first. BusyBox
    # wget (the healthcheck below, and in docker-compose.yml) prefers the
    # ::1 /etc/hosts entry - found by an actual "unhealthy" container with
    # `wget: can't connect to remote host: Connection refused` once that
    # ordering flipped. Listening on both removes the ordering dependency
    # entirely rather than hoping it resolves IPv4 first.
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing (react-router, added v0.2): any path that
    # isn't a real static file falls back to index.html so a direct
    # navigation or page refresh on e.g. /sessions/abc123 works, not just
    # in-app <Link> navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
