server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing (react-router, added v0.2): any path that
    # isn't a real static file falls back to index.html so a direct
    # navigation or page refresh on e.g. /sessions/abc123 works, not just
    # in-app <Link> navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
