services:
  ros:
    build:
      context: ./ros2_ws
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - MULTISENS_SENSORS_CONFIG=/config/sensors.yaml
    volumes:
      - ./config/sensors.yaml:/config/sensors.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Config-driven, not hardcoded (v1.0-RC issue #121): ingestion node
      # names are `{sensor_id}_ingestion`, and sensor ids are only known
      # at runtime from the mounted sensors.yaml - a healthcheck naming
      # specific ids (rgb/depth/thermal) would break for any other config,
      # including two same-modality sensors (e.g. ridesafe_front_rgb/
      # ridesafe_rear_rgb), directly contradicting the "add a sensor via
      # config, not code" claim this project makes throughout. Counts
      # `_ingestion`-suffixed nodes against the number of sensor entries
      # actually declared in the mounted config instead of naming any of
      # them - genuinely config-driven either way.
      test: [
        "CMD-SHELL",
        ". /opt/ros/humble/setup.sh && . /workspace/install/setup.sh && \
         expected=$$(python3 -c \"import yaml; print(len(yaml.safe_load(open('/config/sensors.yaml')).get('sensors', [])))\") && \
         actual=$$(ros2 node list | grep -c _ingestion) && \
         [ \"$$actual\" -ge \"$$expected\" ] && \
         ros2 node list | grep -q system_diagnostics && \
         ros2 node list | grep -q sync_status"
      ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  backend:
    build:
      # Root context (not ./backend) so the Dockerfile can COPY the
      # sibling sdk/ directory - multisens_sdk is installed as an
      # editable dependency, not vendored into backend/ (v0.9, Phase 93).
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - MULTISENS_SENSORS_CONFIG=/config/sensors.yaml
      - MULTISENS_DB_PATH=/data/multisens.db
    volumes:
      - ./config/sensors.yaml:/config/sensors.yaml:ro
      - backend-data:/data
      # Read-only access to locally recorded evidence media (RideSafe
      # bring-up, Phase 24) - e.g. data/recorded/ridesafe/samples/, the
      # frame snapshots Evidence Playback's "inspect frame" serves via
      # GET /api/sessions/{id}/predictions/{id}/frame. Mounted at
      # /media, not /data, since /data is already the SQLite volume
      # above - two different container paths, never merged.
      - ./data:/media:ro
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ros:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      # 8080, not the more conventional 3000: 3000-3005 were occupied by an
      # unrelated process on the dev machine this was built on. Change freely.
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:80 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  # SQLite evaluation database (sessions/predictions/ground truth/results,
  # v0.2+). Reset demo data with `docker compose down -v` or
  # `docker volume rm multisense_backend-data`.
  backend-data:
